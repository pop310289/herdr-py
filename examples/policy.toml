# Same as policy.json; TOML needs Python 3.11+ (use the JSON file on RHEL 8's Python 3.6).
default = "ask"

[[rule]]
permission = "bash"
action = "allow"
match = '(python3 [\w./-]+\.py( [\w./-]+)*|python3 -m (unittest|pytest)( [\w./:-]+)*|ls( -\w+)*( [\w./-]+)*|cat [\w./-]+|git (status|diff|log)( [\w./-]+)*)'

[[rule]]
permission = "bash"
action = "deny"
match = '.*(rm -rf|curl|wget|sudo|ssh|scp).*'
message = "Not allowed here."

[[rule]]
permission = "external_directory"
action = "deny"
message = "Stay inside the project folder."

[[rule]]
permission = "doom_loop"
action = "deny"
message = "You are repeating the same call. Try a different approach."
